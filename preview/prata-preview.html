    b += `<div class="fb-body">`;

    fb.errors.forEach((e, k) => { b += `<div class="err"><div class="err-line"><span class="err-old">${esc(e[0])}</span><span>→</span><span class="err-new">${esc(e[1])}</span><span class="tag">${e[2]}</span></div><div>${esc(e[3])}</div>
      <button class="save" data-save="${i}:${k}" ${e.saved ? "disabled" : ""}>${e.saved ? "✓ Sparad i glosor" : `+ Spara ”${esc(e[4])}” som glosa`}</button></div>`; });
    if (fb.natural) b += `<div><div class="fb-label">Mer naturligt</div><div class="fb-text">${esc(fb.natural)} <button class="mini" data-say="${esc(fb.natural)}" aria-label="Lyssna">🔊</button></div></div>`;
    if (fb.tip) b += `<div>${esc(fb.tip)}</div>`;
    b += `</div>`;
  }
  return `<div class="fb ${fb.status}"><button class="fb-head" data-fb="${i}"><span>${h}</span><span class="sp"></span><span class="caret">${open ? "▲" : "▼"}</span></button>${b}</div>`;
}
function viewChat() {
  const c = st.chat, s = c.s, l = L();
  const last = [...c.msgs].reverse().find((m) => m.role === "p");
  return `<section class="chat">
    <div class="chat-top pad"><button class="icon-btn" data-a="back" aria-label="Tillbaka">←</button><div class="chat-title"><strong>${s.e} ${s.t}</strong><span>${l[2]} ${l[1]} · ${st.level}</span></div>
      <button class="icon-btn" data-a="slow" aria-pressed="${st.slow}" title="Långsamt tal" aria-label="Långsamt tal">🐢</button></div>
    <div class="pad"><div class="goal"><b>Mål:</b> ${esc(s.goal)}</div></div>
    <div class="thread pad" id="thread">${c.msgs.map((m, i) => m.role === "p"
      ? `<div class="msg partner"><div class="bubble">${esc(m.text)}${m.tr ? `<div class="translation">${esc(m.trText)}</div>` : ""}</div><div class="actions"><button class="mini" data-say="${esc(m.text)}">🔊 Lyssna</button><button class="mini" data-tr="${i}">${m.tr ? "Dölj" : "Översätt"}</button></div></div>`
      : `<div class="msg user"><div class="bubble">${esc(m.text)}</div>${m.fb ? fbHTML(m.fb, i) : ""}</div>`).join("")}
      ${c.loading ? `<div class="msg partner"><div class="bubble typing"><i></i><i></i><i></i></div></div>` : ""}</div>
    <div class="composer pad">
      ${last && !c.loading && last.sugg ? `<div class="suggestions">${last.sugg.map((x) => `<button class="suggestion" data-fill="${esc(x[0])}">${esc(x[0])}<span>${esc(x[1])}</span></button>`).join("")}</div>` : ""}
      <div class="input-row"><button class="round" data-a="mic" aria-label="Prata">🎤</button>
        <textarea id="input" rows="1" placeholder="Svara på ${l[1].toLowerCase()}…">${c.step === 0 && !c.loading ? esc(s.sample) : ""}</textarea>
        <button class="round send" data-a="send" aria-label="Skicka">➤</button></div></div>
  </section>`;
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = (s) => s.toLowerCase().trim().replace(/\s+/g, " ");
const strip = (s) => norm(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/^(el|la|los|las|un|una)\s+/, "");

function render() {
  const v = st.view;
  let html;
  if (v === "chat") html = `<div class="shell" style="height:100%">${viewChat()}</div>`;
  else if (v === "study") html = `<div class="shell">${viewStudy()}</div>`;
  else if (v === "done") html = `<div class="shell">${viewDone()}</div>`;
  else if (v === "newdeck") html = `<div class="shell">${viewNewDeck()}</div>`;
  else html = `<div class="shell">${header()}${{ idag: viewIdag, prata: viewPrata, glosor: viewGlosor, framsteg: viewFramsteg }[st.tab]()}</div>${tabbar()}`;
  $app.innerHTML = html + sheet();
  const th = document.getElementById("thread"); if (th) th.scrollTop = th.scrollHeight;
}

function openChat(id) {
  const s = SCEN.find((x) => x.id === id);
  st.chat = { s, msgs: [], step: 0, loading: true }; st.view = "chat"; render();
  setTimeout(() => { st.chat.loading = false; st.chat.msgs.push({ role: "p", text: s.open[0], trText: s.open[1] }); render(); }, 650);
}
function sendChat() {
  const c = st.chat, t = document.getElementById("input").value.trim();
  if (!t || c.loading) return;
  let fb;
  if (c.step === 0 && t === c.s.sample) fb = JSON.parse(JSON.stringify(c.s.fb));
  else fb = { status: "minor", corrected: "", natural: "", errors: [], tip: c.step === 0 ? "I förhandsvisningen rättas bara exempelmeningen. I appen rättas allt du skriver." : "Här slutar förhandsvisningen. I appen fortsätter samtalet så länge du vill." };
  if (fb.status === "perfect") fb.open = false;
  c.msgs.push({ role: "u", text: t, fb }); c.loading = true; render();
  setTimeout(() => { c.loading = false; if (c.step === 0) c.msgs.push({ role: "p", text: c.s.reply[0], trText: c.s.reply[1], sugg: c.s.sugg }); c.step++; render(); }, 800);
}
function nextCard() {
  const s = st.study; s.pos++; s.revealed = false; s.opts = null; s.picked = null; s.typed = ""; s.verdict = null;
  if (s.pos >= QUEUE.length) { st.view = "done"; st.decks[0].due = 0; st.decks[1].due = 0; } render();
}

$app.addEventListener("click", (e) => {
  const b = e.target.closest("button, .scrim"); if (!b) return;
  if (b.classList.contains("scrim") && e.target !== b) return;
  const d = b.dataset;
  if (d.tab) { st.tab = d.tab; st.view = null; render(); window.scrollTo(0, 0); }
  else if (d.lang) { st.lang = d.lang; try { localStorage.setItem("p.lang", d.lang); } catch (x) {} render(); }
  else if (d.level) { st.level = d.level; try { localStorage.setItem("p.level", d.level); } catch (x) {} render(); }
  else if (d.scen) openChat(d.scen);
  else if (d.area) { st.form.area = d.area; st.form.custom = ""; render(); }
  else if (d.total) { st.form.total = +d.total; render(); }
  else if (d.perday) { st.form.perDay = +d.perday; render(); }
  else if (d.say) speak(d.say);
  else if (d.fill) { const i = document.getElementById("input"); i.value = d.fill; i.focus(); }
  else if (d.tr !== undefined) { const m = st.chat.msgs[+d.tr]; m.tr = !m.tr; render(); }
  else if (d.fb !== undefined) { const m = st.chat.msgs[+d.fb]; m.fb.open = m.fb.open === false; render(); }
  else if (d.save) { const [i, k] = d.save.split(":").map(Number); const er = st.chat.msgs[i].fb.errors[k]; er.saved = true; st.decks[2].total++; st.decks[2].due++; toast(`”${er[4]}” sparad i Från samtal`); render(); }
  else if ("grade" in d) { st.study.correct++; nextCard(); }
  else if (d.pick) { const s = st.study; s.picked = d.pick; if (d.pick === WORDS[QUEUE[s.pos].i].w) s.correct++; render(); }
  else if (d.a) {
    const a = d.a;
    if (a === "sheet") { st.sheet = true; render(); }
    else if (a === "closesheet") { st.sheet = false; render(); }
    else if (a === "study") { st.study = { pos: 0, correct: 0 }; st.view = "study"; render(); window.scrollTo(0, 0); }
    else if (a === "reveal") { st.study.revealed = true; render(); }
    else if (a === "next") nextCard();
    else if (a === "check") {
      const s = st.study, w = WORDS[QUEUE[s.pos].i], v = document.getElementById("write").value; s.typed = v;
      if (!v.trim()) return;
      s.verdict = norm(v).replace(/^(el|la)\s+/, "") === norm(w.w).replace(/^(el|la)\s+/, "") ? "right" : strip(v) === strip(w.w) ? "near" : "wrong";
      if (s.verdict !== "wrong") s.correct++; render();
    }
    else if (a === "newdeck") { st.view = "newdeck"; render(); window.scrollTo(0, 0); }
    else if (a === "createdeck") {
      const f = st.form, name = f.custom.trim() || f.area;
      b.disabled = true; b.textContent = "AI:n skapar dina glosor…";
      setTimeout(() => { st.decks.unshift({ id: Date.now(), name, total: f.total, learned: 0, learning: 0, due: f.perDay, perDay: f.perDay, level: st.level }); st.view = null; st.tab = "glosor"; render(); toast(`${f.total} glosor skapade – ${f.perDay} nya väntar idag`); }, 1200);
    }
    else if (a === "back" || a === "home") { if (a === "home") st.tab = "idag"; st.view = null; try { speechSynthesis.cancel(); } catch (x) {} render(); }
    else if (a === "slow") { st.slow = !st.slow; render(); }
    else if (a === "mic") toast("Röstläget kommer i fas 4");
    else if (a === "send") sendChat();
  }
});
$app.addEventListener("input", (e) => { if (e.target.id === "custom-area") st.form.custom = e.target.value; });
$app.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || e.shiftKey) return;
  if (e.target.id === "input") { e.preventDefault(); sendChat(); }
  if (e.target.id === "write") { e.preventDefault(); const btn = $app.querySelector('[data-a="check"]'); if (btn) btn.click(); }
});
render();
</script>
